http_port 3129 transparent
cache_dir ufs /var/cache/squid 20000 16 256
maximum_object_size 5 GB

# Every test VM starts at the same second and asks for the same packages in
# the same order, so fifteen of the sixteen requests for a given RPM arrive
# while the first one is still in flight - too early to be a cache hit. Squid
# answers each of them with a fetch of its own from the parent proxy, which
# turned 1506 distinct packages into 17243 upstream requests on a cold cache.
# The parent tolerates that for about four minutes and then returns 503 to
# everything, which librepo reports as "all mirrors were already tried".
#
# This makes the later arrivals wait on the first fetch instead of starting
# their own - the one thing the cache cannot do while it is still cold, which
# is the state every daily run begins in.
collapsed_forwarding on
